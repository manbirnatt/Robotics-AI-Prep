/* Lock screen: the app itself is AES-encrypted below and only decrypted with the right password. */
:root{--bg:#0B2A4A;--card:#12355C;--ink:#FFFFFF;--muted:#B9C6D6;--gold:#C9B37A;--bad:#F08A80;color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
form{width:100%;max-width:360px;display:grid;gap:14px;background:var(--card);border-radius:16px;padding:24px}
img{width:72px;height:72px;border-radius:16px}
h1{margin:0;font-size:26px;line-height:1.1}
p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:1.5px solid #3A5A80;background:#0B2A4A;color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--gold);outline-offset:1px}
label.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
button{font:inherit;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--gold);color:#0B2A4A;cursor:pointer}
button[disabled]{opacity:.6}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
</style>

const KEY = "rap-key";
function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
async function openWith(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function fromPassword(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:P.it, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
(async function(){
  // Remembered device: unlock straight away (also works offline)
  try{
    const saved = localStorage.getItem(KEY);
    if(saved){
      const key = await crypto.subtle.importKey("jwk", JSON.parse(saved), {name:"AES-GCM"}, true, ["decrypt"]);
      await openWith(key); return;
    }
  }catch(e){ try{ localStorage.removeItem(KEY); }catch(_){} }
  document.getElementById("pw").focus();
})();
document.getElementById("f").addEventListener("submit", async function(e){
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; go.textContent = "Unlocking…"; err.textContent = "";
  try{
    const key = await fromPassword(document.getElementById("pw").value.trim());
    await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct)); // throws on a wrong password
    if(document.getElementById("rem").checked){ try{ localStorage.setItem(KEY, JSON.stringify(await crypto.subtle.exportKey("jwk", key))); }catch(_){} }
    await openWith(key);
  }catch(ex){
    go.disabled = false; go.textContent = "Unlock"; err.textContent = "That password didn't work. Check for typos and try again.";
  }
});
