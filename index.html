{t:"SLAM",d:3,s:"Lecture · Motion constraint",q:"The robot moves from x₀ to x₁ by +5 (x₁ = x₀ + 5). What is added to ξ?",
o:[["ξ[x₀] += −5 and ξ[x₁] += +5","Correct. Written twice: x₀ − x₁ = −5 (row x₀) and x₁ − x₀ = +5 (row x₁)."],
["ξ[x₀] += +5 and ξ[x₁] += −5","Signs swapped. The row of the variable that is 'ahead' (x₁) gets +motion."],
["ξ[x₁] += +5 only","Every two-variable constraint touches both rows."],
["ξ[x₀] += 5 and ξ[x₁] += 5","The two rows get opposite signs, since they're the same equation from opposite sides."]],k:"Motion d from xᵢ to xⱼ: Ω[i][i] += 1, Ω[j][j] += 1, Ω[i][j] −= 1, Ω[j][i] −= 1; ξ[i] −= d, ξ[j] += d."},

{t:"SLAM",d:3,s:"Lecture · Landmark constraint",q:"At pose x₁ the robot sees landmark L₀ at a distance of +9 (L₀ = x₁ + 9). Which Ω entries change?",
o:[["Ω[x₁][x₁] += 1, Ω[L₀][L₀] += 1, Ω[x₁][L₀] −= 1, Ω[L₀][x₁] −= 1","Correct. Exactly the motion pattern, just between a pose and a landmark (the block is spread out in the matrix, but it's still a 2×2 pattern)."],
["Only Ω[L₀][L₀] += 1","A measurement relates TWO variables, so both diagonals and both off-diagonals change."],
["Ω[x₁][x₁] += 9, Ω[L₀][L₀] += 9","The measured value goes into ξ, not Ω. Ω gets the weights (1s)."],
["Ω[x₀][L₀] −= 1","The measurement was taken at x₁, not x₀."]],k:"Measurements and motions use the same +1/−1 pattern. The measured distance goes into ξ (−9 at x₁, +9 at L₀)."},

{t:"SLAM",d:2,s:"Lecture · Solve a path",q:"1-D Graph SLAM: x₀ = −3 (initial), then move +5, then move +3, with no noise. What does μ = Ω⁻¹ξ give for (x₀, x₁, x₂)?",
o:[["(−3, 2, 5)","Correct. −3, −3 + 5 = 2, 2 + 3 = 5. With consistent data, Graph SLAM returns exactly the dead-reckoned path."],
["(0, 5, 8)","That ignores the initial constraint of −3."],
["(−3, 5, 3)","Those are the motions, not the positions."],
["(−3, −8, −11)","That subtracts the motions instead of adding them."]],k:"With no conflicts, μ just chains the constraints together."},

{t:"SLAM",d:3,s:"Lecture quiz · Landmark position",q:"Same path (−3, 2, 5). The landmark is measured at +10 from x₀, +5 from x₁ and +2 from x₂. Where is the landmark?",
o:[["7","Correct. −3 + 10 = 7, 2 + 5 = 7, 5 + 2 = 7. All three agree."],
["17","That adds all three measurements to x₀."],
["5","That's x₂, the last robot position."],
["10","That's just the first measurement, without adding x₀ = −3."]],k:"Landmark = pose + relative measurement. Consistent data → every measurement points to the same spot."},

{t:"SLAM",d:3,s:"Lecture quiz · Count constraints",q:"6 robot poses (1 initial + 5 motions) and 8 landmark measurements. How many constraints in total?",
o:[["14","Correct. 1 initial + 5 motions + 8 measurements = 14."],
["13","Forgot the initial-position constraint."],
["19","That counts 6 motions (one per pose). With 6 poses there are only 5 motions."],
["48","That multiplies poses × measurements. Each measurement is one constraint."]],k:"Constraints = 1 (anchor) + (poses − 1) motions + number of measurements."},

{t:"SLAM",d:3,s:"Practice · Count constraints",q:"4 robot poses and 5 landmark measurements. How many constraints?",
o:[["9","Correct. 1 initial + 3 motions + 5 measurements = 9."],
["8","Forgot the initial constraint."],
["10","Counted 4 motions. 4 poses need only 3 motions between them."],
["20","Constraints add, they don't multiply."]],k:"1 + (N − 1) + M."},

{t:"SLAM",d:4,s:"Lecture quiz · Untouched fields",q:"3 poses (x₀, x₁, x₂) and 2 landmarks. L₀ is seen from x₀ and x₁; L₁ is seen from x₁ and x₂. How many of the 25 entries of the 5×5 Ω are NEVER touched?",
o:[["8","Correct. Missing links: x₀–x₂ (no direct motion), x₀–L₁, x₂–L₀ (not seen there) and L₀–L₁ (landmarks never see each other). Each missing link is 2 symmetric entries: 4 × 2 = 8."],
["6","Sebastian's first answer too! He forgot that landmarks are never directly linked to each other, which is 2 more zeros."],
["4","Each missing link leaves TWO zeros (Ω is symmetric)."],
["0","Not every pair of variables is constrained. Ω is sparse."]],k:"Zeros in Ω = pairs with no direct constraint. The landmark–landmark block is always diagonal."},

{t:"SLAM",d:3,s:"Lecture · Landmark block",q:"Which part of Ω is always a DIAGONAL matrix (all off-diagonal entries zero)?",
o:[["The landmark–landmark block","Correct. 'Landmarks can't see', so no constraint ever links two landmarks directly."],
["The pose–pose block","Consecutive poses are linked by motions, so that block has off-diagonal entries (it's tridiagonal)."],
["The pose–landmark block","Any pose that observes a landmark puts −1s here."],
["None of Ω","The landmark block is the guaranteed diagonal one."]],k:"Pose–pose: tridiagonal (motions). Pose–landmark: wherever observations happened. Landmark–landmark: diagonal."},

{t:"SLAM",d:4,s:"Lecture quiz · Introducing noise",q:"Path (−3, 2, 5), landmark at 7. Now change the LAST measurement from +2 to +1 (all weights 1). What happens to x₀ and x₂?",
o:[["x₀ stays −3; x₂ grows above 5 (it becomes 5.5)","Correct. x₀ is pinned by the only absolute constraint. The tighter x₂–landmark band pulls x₂ up and the landmark down (to 6.875)."],
["x₀ and x₂ both shift right","Relative bands can't move the anchor. Only the initial constraint fixes absolute position."],
["x₂ shrinks below 5","A shorter measured distance pulls x₂ and the landmark TOWARD each other: x₂ moves up toward the landmark."],
["Nothing changes; SLAM ignores inconsistent data","It doesn't ignore it. It spreads the disagreement across all the bands (least squares)."]],k:"Only the anchor sets absolute position. Inconsistent bands are relaxed together, so every free variable moves a little."},

{t:"SLAM",d:3,s:"Lecture · Confidence weights",q:"You want one measurement to count MORE (you trust it more). How do you enter it?",
o:[["Multiply BOTH its Ω entries and its ξ entries by the same bigger factor (like 1/σ)","Correct. Sebastian replaced the 1s by 5s in Ω and multiplied the measurement by 5 in ξ."],
["Multiply only its Ω entries by the factor","Sebastian warns this gives 'a very kooky answer'. Ω and ξ must be scaled together."],
["Multiply only its ξ entries","That changes the measured value itself, not its confidence."],
["Add the constraint once more with weight 1","Adding it twice does double the weight. But scaling by 1/σ is the general way, and the lecture's answer is to scale both."]],k:"Weight = 1/σ (more confident = smaller σ = bigger weight). Scale Ω AND ξ by it."},

{t:"SLAM",d:5,s:"Lecture · Weighted result",q:"Same as before (last measurement changed to +1), but now that measurement has weight 5. Roughly what are x₂ and the landmark?",
o:[["x₂ ≈ 5.71, landmark ≈ 6.82: about 1 apart","Correct. Trusting the last measurement 5× more pulls x₂ and the landmark to nearly the measured distance of 1. x₀ stays −3."],
["x₂ = 5.5, landmark = 6.875","Those are the equal-weight values. Extra weight pulls them closer still."],
["x₂ = 5, landmark = 7","That ignores the new measurement entirely."],
["x₂ = 6, landmark = 7","The landmark also moves. Both ends of the stretched band give a little."]],k:"Bigger weight → that constraint is satisfied more closely, at the expense of the others."},

{t:"SLAM",d:3,s:"PS6 style · Matrix size",q:"2-D Graph SLAM with x and y interleaved in one matrix. N = 20 poses and 5 landmarks. What size is Ω?",
o:[["50 × 50","Correct. Each pose and each landmark has x and y: 2 × (20 + 5) = 50."],
["25 × 25","That counts each pose/landmark once. In 2-D each one needs two rows (x and y)."],
["100 × 100","Doubled twice. It's 2 × (N + L), not 4 × (N + L)."],
["20 × 5","Ω is square, with one row and column for every unknown."]],k:"dim(Ω) = 2·(N + num_landmarks) in 2-D. ξ has the same length."},

{t:"SLAM",d:4,s:"PS6 style · Growth",q:"In full Graph SLAM, as the robot's path gets longer, how do Ω and ξ grow?",
o:[["Ω grows quadratically (it's square) and ξ grows linearly","Correct. Each new pose adds a row AND a column to Ω, but only one entry to ξ."],
["Both grow linearly","Ω gains a row and a column each time, so its number of entries grows with the square."],
["Neither grows; they're fixed size","That's ONLINE SLAM, which marginalizes old poses away."],
["Ω grows linearly, ξ quadratically","Reversed."]],k:"Full SLAM: Ω ~ (path length)², ξ ~ path length. Online SLAM keeps them a fixed size."},

{t:"SLAM",d:4,s:"PS6 style · Online SLAM",q:"What is the idea behind ONLINE Graph SLAM?",
o:[["Keep only the CURRENT pose (plus landmarks); after each motion, fold the old pose's information into the rest and drop it","Correct. Ω and ξ stay a fixed size. In PS6, online_slam returns both μ and the final Ω."],
["Run full Graph SLAM again from scratch every step","That gets slower and slower. Online SLAM avoids it."],
["Throw away old measurements entirely","The information is kept, just folded (marginalized) into the remaining variables, not discarded."],
["Only track landmarks, never poses","It still tracks the current pose."]],k:"Online SLAM = marginalize old poses → constant-size Ω, ξ. Returns μ and Ω."},

{t:"SLAM",d:4,s:"PS6 style · Fill Ω and ξ",q:"x₀ = 0 (initial), move +5 to x₁, then move −4 to x₂ (all weights 1). What is ξ?",
o:[["[−5, 9, −4]","Correct. x₀: 0 (initial) − 5 = −5. x₁: +5 (arriving) + 4 (from −(−4) leaving) = 9. x₂: −4. And Ω = [[2, −1, 0], [−1, 2, −1], [0, −1, 1]]."],
["[0, 5, 1]","That's μ, the solution (positions 0, 5, 1), not ξ."],
["[−5, 1, −4]","x₁'s second contribution is −(−4) = +4, so 5 + 4 = 9."],
["[5, −9, 4]","Every sign is flipped. The 'from' variable gets −d, the 'to' variable gets +d."]],k:"For a motion d from i to j: ξ[i] −= d, ξ[j] += d. Watch the double negative when d is negative."},

{t:"SLAM",d:4,s:"Practice · Singular Ω",q:"A landmark slot is in Ω, but the robot NEVER observed that landmark. What happens when you compute Ω⁻¹?",
o:[["Ω can't be inverted: that landmark's row and column are all zeros","Correct. With no constraint, the landmark could be anywhere, so there's no unique solution."],
["The landmark is placed at the origin","Math doesn't default to the origin. The inverse doesn't exist."],
["The landmark is placed at the last robot pose","There's no constraint linking it to any pose."],
["It works fine because ξ is zero there too","A zero row in Ω makes it singular regardless of ξ."]],k:"Every variable needs at least one constraint (and something must anchor absolute position), or Ω is singular."},

{t:"SLAM",d:4,s:"Lecture · Why it works",q:"Why does solving μ = Ω⁻¹ξ give the MOST LIKELY path and map?",
o:[["Each constraint is a Gaussian; maximizing their product = minimizing the sum of squared errors, which is a linear system Ωμ = ξ","Correct. Take the log of the product of Gaussians: constants and exponentials drop away and you're left with a sum of squares. Setting its gradient to 0 gives exactly Ωμ = ξ."],
["Because Ω is always the identity matrix","Ω has 2s, −1s and so on. It isn't the identity."],
["Because it's the average of all the measurements","It's a weighted least-squares fit, not a simple average."],
["It's a heuristic with no probabilistic meaning","It's the exact maximum-likelihood answer for linear Gaussian constraints."]],k:"Product of Gaussians → sum of squared residuals → linear equations Ωμ = ξ. Weight = confidence (1/σ)."},

{t:"SLAM",d:5,s:"Challenge · Inconsistent triangle",q:"1-D: x₀ = 0 (initial). Motion x₀ → x₁ is +4. The landmark is measured at +6 from x₀ and at +1 from x₁. All weights are 1. What do x₁ and the landmark L come out as?",
o:[["x₁ ≈ 4.33, L ≈ 5.67","Correct. The data disagree (4 + 1 = 5 vs 6), so the 1-unit mismatch is shared equally by the three bands (1/3 each): x₁ = 4 + 1/3, L = 6 − 1/3. x₀ stays at 0."],
["x₁ = 4, L = 6","That fully trusts the motion and the first measurement, and ignores the second measurement."],
["x₁ = 5, L = 6","That fully trusts both measurements and ignores the motion."],
["x₁ = 4.5, L = 5.5","That splits the mismatch only between two bands. All three bands in the loop stretch, so each takes 1/3."]],k:"In a loop of equal-weight constraints, the mismatch is shared evenly. Solve Ωμ = ξ to check: Ω = [[3,−1,−1],[−1,2,−1],[−1,−1,2]], ξ = [−10, 3, 7]."},

{t:"SLAM",d:2,s:"SLAM recap quiz · Filters",q:"Which filters can represent MULTIMODAL beliefs (more than one peak)? (Select all that apply.)",
o:[["Histogram filter","Yes. Each cell holds its own probability, so any shape is possible."],
["Particle filter","Yes. Clumps of particles can form in several places."],
["Kalman filter","No. A single Gaussian has exactly one peak."]],a:[0,1],k:"Multimodal: histogram + particle. Unimodal: Kalman. Exponential in dimensions: histogram + particle. Useful: all three!"},

{t:"SLAM",d:3,s:"Lecture · Wrap-up",q:"In the 'put it all together' car, which pieces run in a loop while driving?",
o:[["A particle filter estimates the position; a PD controller steers using CTE relative to the smoothed A* path","Correct. Plan (A* + smoothing) once, then repeatedly: estimate position → compute CTE → steer."],
["A* re-plans from scratch every step","The lecture plans once up front. The controller handles small deviations."],
["SLAM builds the map while the car drives","The map (grid) is given in this exercise."],
["Twiddle runs on every step","Twiddle is offline tuning, not part of the driving loop."]],k:"Localization (PF) + planning (A*, smoothing) + control (PD on CTE) = a self-driving car."}
);

CARDS.push(
["SEARCH","Planning in one line","Given a map, a start and a goal, find the cheapest sequence of moves. (Localization = where am I; planning = how do I get there; control = how do I steer.)"],
["SEARCH","g, h, f","g = cost so far from the start. h = heuristic guess of the cost still to go. f = g + h. A* expands the open cell with the smallest f."],
["SEARCH","Open vs closed","Open list = discovered, waiting to be expanded (the frontier). Closed/checked = already added, never added again."],
["SEARCH","Breadth-first vs uniform cost","Breadth-first expands by number of steps; optimal only when every step costs the same. With unequal costs, expand by g (uniform-cost search)."],
["SEARCH","Admissible heuristic","h(cell) ≤ true cheapest cost to the goal, everywhere. Admissible → A* is optimal. Not admissible → A* MAY return a suboptimal path."],
["SEARCH","Grid heuristics","4-connected, unit cost: Manhattan |Δx| + |Δy| is admissible. Diagonals at cost 1: use max(|Δx|, |Δy|); Manhattan then overestimates."],
["SEARCH","A* with h = 0","Becomes uniform-cost / breadth-first. Still optimal, just explores more cells."],
["SEARCH","Dynamic programming (value iteration)","Value(goal) = 0; repeat value(cell) = min over moves [cost + value(next)] until nothing changes. Gives a value AND best action for EVERY cell (universal plan)."],
["SEARCH","Policy","A map from each cell to its best action. Read it off the value grid: step to the neighbor with the lowest cost + value."],
["SEARCH","Why 99?","Lecture code starts all values at 99 (≈ infinity). Walls and unreachable cells stay 99."],
["SEARCH","3-D planning state","When turn costs depend on heading, the state is (x, y, θ). States = cells × headings."],
["SEARCH","Stochastic motion","Action succeeds with success_prob; otherwise slips orthogonally (split equally). Value = step cost + Σ P(outcome)·value(outcome); walls cost collision_cost."],
["SEARCH","Planner comparison","BFS, A*, DP: discrete, global, optimal. DP: the only universal one. Smoothing: continuous and local."],
["PID","Cross-track error (CTE)","Signed sideways distance between the robot and the reference path."],
["PID","P, I, D roles","P: steer ∝ −CTE (reduce error). D: ∝ −ΔCTE/Δt (avoid overshoot). I: ∝ −ΣCTE (remove systematic drift)."],
["PID","PID steering","steer = −τp·CTE − τd·(CTE − CTE_prev)/Δt − τi·ΣCTE."],
["PID","Behaviors","P only: overshoots and oscillates (marginally stable). PD: settles without overshoot. PD + drift: steady offset. PID: offset removed."],
["PID","Smoothing update","yᵢ += α(xᵢ − yᵢ) + β(yᵢ₊₁ + yᵢ₋₁ − 2yᵢ) for interior points; repeat until the total change < tolerance. Lecture: α (weight_data) = 0.5, β (weight_smooth) = 0.1."],
["PID","Smoothing extremes","Data only → original path. Smooth only + fixed ends → straight line. Smooth only, nothing fixed → one point. Both → smooth path near the original."],
["PID","Cyclic & constrained smoothing (PS5)","Cyclic: neighbors wrap with % n, nothing fixed. Constrained: points marked 'fix' are never updated."],
["PID","Twiddle","p = [0,0,0], dp = [1,1,1]. For each i: p[i] += dp[i]; better → dp[i] ×= 1.1. Else p[i] −= 2dp[i]; better → dp[i] ×= 1.1. Else p[i] += dp[i], dp[i] ×= 0.9. Loop while sum(dp) > tol."],
["PID","Segmented CTE","Δ = p2 − p1, R = robot − p1. u = (R·Δ)/|Δ|²; u > 1 → next segment. CTE = (Ry·Δx − Rx·Δy)/|Δ| (lecture divides by |Δ|², which works but isn't the true distance)."],
["PID","Racetrack CTE (PS5)","Straight parts: offset from the straight line. Curved parts: distance to the half-circle's center minus the radius."],
["SLAM","SLAM","Simultaneous Localization And Mapping: build the map while localizing in it, because motion drift would otherwise warp the map."],
["SLAM","Graph SLAM idea","Every motion and measurement is a Gaussian rubber band between two variables. Collect them all in Ω and ξ, then solve μ = Ω⁻¹ξ for the whole path and map."],
["SLAM","Adding a constraint","Between i and j with value d (xⱼ − xᵢ = d): Ω[i][i] += w, Ω[j][j] += w, Ω[i][j] −= w, Ω[j][i] −= w; ξ[i] −= w·d, ξ[j] += w·d."],
["SLAM","Initial constraint","Ω[0][0] += 1, ξ[0] += x₀. The only absolute constraint; without it Ω is singular."],
["SLAM","Counting constraints","1 initial + (poses − 1) motions + number of measurements."],
["SLAM","Zeros in Ω","No direct constraint → zero. Landmark–landmark block is always diagonal; pose–pose block is tridiagonal."],
["SLAM","Confidence","Weight constraints by 1/σ (lecture code divides by the noise). Scale BOTH the Ω and ξ entries."],
["SLAM","Noisy example","x₀ = −3, +5, +3; landmark at 10, 5, 2 → (−3, 2, 5, 7). Change last 2 → 1: (−3, 2.125, 5.5, 6.875). x₀ never moves."],
["SLAM","Sizes","2-D, x and y interleaved: dim = 2(N + landmarks). Full SLAM: Ω grows quadratically, ξ linearly. Online SLAM keeps the size fixed and returns μ and Ω."],
["EXAM","Final exam","Dec 11–13, 30 questions in 90 minutes, 12% of the grade. About 80% Search, PID and SLAM; the rest from the midterm topics."]
);

{t:"PROB",n:"Start here",title:"Probability from zero",mins:8,goal:"Read and combine probabilities the way every filter in this course does.",blocks:[
["p","A probability is a number between 0 and 1 saying how likely something is. 0 means impossible, 1 means certain, 0.5 means a coin flip. When you list every possible outcome, their probabilities must add up to 1, because one of them has to happen."],

["h","Three rules you'll use constantly"],
["list",["Complement: P(not A) = 1 − P(A).","Independent AND: if A and B don't affect each other, P(A and B) = P(A) × P(B).","At least one: P(at least one 6 in 3 rolls) = 1 − P(no 6 at all) = 1 − (5/6)³."]],
["h","Conditional probability"],
["p","P(B|A) reads 'the probability of B given that A happened'. It zooms in on the world where A is true. P(B|A) and P(A|B) are usually very different. Mixing them up is the number one exam trap."],
["eq","P(A|B) = P(A, B) / P(B)"],
["h","Total probability: averaging over cases"],
["p","When B can happen in different situations, add up each situation's chance, weighted by how likely that situation is."],
["eq","P(B) = P(B|A)·P(A) + P(B|¬A)·P(¬A)"],
["ex","P(A) = 0.3, P(B|A) = 0.9, P(B|¬A) = 0.2. Then P(B) = 0.9·0.3 + 0.2·0.7 = 0.27 + 0.14 = 0.41."],
["p","This is exactly what a robot does when it MOVES: 'where am I now?' is an average over 'where was I before?'."],
["h","Bayes' rule: flipping the condition"],
["eq","P(A|B) = P(B|A)·P(A) / P(B)"],
["list",["P(A) is the prior: what you believed before.","P(B|A) is the likelihood: how well A explains what you saw.","P(B) is the normalizer: it makes the answers add to 1.","P(A|B) is the posterior: what you believe after."]],
["ex","Rare disease: P(C) = 0.001, P(+|C) = 0.8, P(+|¬C) = 0.1. Multiply prior × likelihood for each case: 0.0008 vs 0.0999. Normalize: 0.0008 / 0.1007 ≈ 0.0079. A positive test still means under 1%, because the disease is so rare."],
["p","This is exactly what a robot does when it SENSES: 'given what I just saw, where am I?'"],

{t:"LOC",n:"Lesson 1",title:"Localization: where am I?",mins:10,goal:"Run the sense → move loop of a histogram filter by hand.",blocks:[
["p","The robot has a map but doesn't know where it is on it. Split the world into cells and keep one probability per cell. That list of numbers is the robot's belief."],
["an","Imagine waking up in a hallway of identical-looking doors with your eyes shut. At first any spot is equally likely (a uniform belief). Open your eyes and see a door: spots next to doors become more likely. Walk a few steps: your guesses slide along with you, but get a bit fuzzier."],
["h","Start: maximum confusion"],
["eq","n cells → each cell gets 1/n"],
["h","Sense: multiply, then normalize"],
["p","For each cell, multiply its probability by pHit if the map matches what the sensor saw, or pMiss if it doesn't. Then divide everything by the total so it sums to 1 again."],
["ex","World G R R G G, each cell 0.2. Sensor sees red; pHit 0.6, pMiss 0.2. Red cells: 0.2 × 0.6 = 0.12. Green cells: 0.2 × 0.2 = 0.04. Total = 0.36. Normalized: red 1/3 each, green 1/9 each."],
["h","Move: shift, and blur if motion is imperfect"],
["p","An exact move of U cells to the right just shifts the list: new[i] = old[i − U], wrapping around in a cyclic world. With imperfect motion, each cell collects probability from several places: mostly the exact source, a little from 'undershoot' and 'overshoot'."],
["eq","new[i] = 0.8·old[i−U] + 0.1·old[i−U+1] + 0.1·old[i−U−1]"],
["ex","Prior [0, 1, 0, 0, 0], U = 1. Result [0, 0.1, 0.8, 0.1, 0]. Most mass goes one cell right; 10% stays short and 10% goes too far."],
["h","The whole loop"],
["list",["Sense = Bayes' rule = product + normalize. It GAINS information (sharper).","Move = total probability = convolution. It LOSES information (blurrier).","Move forever without sensing → uniform. Sense the same thing twice in a row without moving → more and more confident."]],
["trap","In code, the shift is p[(i − U) % n], not i + U. You're asking 'where did cell i's probability come FROM?'"]]},

{t:"KF",n:"Lesson 2",title:"Kalman filters: tracking with bell curves",mins:12,goal:"Do the 1-D update and predict steps, and know what each matrix in the multi-D filter means.",blocks:[
["p","A histogram filter needs a number for every cell, which gets huge fast. A Kalman filter instead describes the belief with one bell curve (a Gaussian): a mean μ (the best guess) and a variance σ² (how unsure you are)."],
["an","Two friends guess where your car is. One is careful (small variance), one is sloppy (big variance). The best combined guess sits between them but closer to the careful friend, and you end up more sure than either friend alone."],
["h","Measurement update: combine two Gaussians"],
["eq","μ' = (r²·μ + σ²·z) / (σ² + r²)      σ'² = 1 / (1/σ² + 1/r²)"],
["ex","Prior μ = 10, σ² = 8. Measurement z = 13, r² = 2. μ' = (2·10 + 8·13)/10 = 12.4. σ'² = 1/(1/8 + 1/2) = 1.6. The new mean leans toward the more certain measurement, and the variance is smaller than both."],
["h","Predict: move the Gaussian"],
["eq","μ' = μ + u      σ'² = σ² + q"],
["p","Moving adds the motion to the mean and adds the motion noise to the variance. Uncertainty always grows when you predict."],
["h","Kalman gain: how much to trust the sensor"],
["eq","K = σ²/(σ² + r²)    μ' = μ + K·(z − μ)    σ'² = (1 − K)·σ²"],
["p","K near 1: trust the measurement (prior very unsure or sensor very good). K near 0: ignore the measurement."],
["h","More dimensions"],
["list",["x = state (e.g. position and velocity). P = its uncertainty (covariance).","F = how the state moves in one time step. Q = motion noise.","H = which parts of the state the sensor measures. R = sensor noise.","Predict: x = F·x + u, P = F·P·Fᵀ + Q.","Update: y = z − H·x, S = H·P·Hᵀ + R, K = P·Hᵀ·S⁻¹, x = x + K·y, P = (I − K·H)·P."]],
["p","Magic trick: the sensor only measures position, but because F links position and velocity, a few updates reveal the velocity too."],
["trap","Kalman filters are unimodal: one peak only. They're exact only when everything is linear and Gaussian."]]},

{t:"PF",n:"Lesson 3",title:"Particle filters: thousands of guesses",mins:10,goal:"Explain weights and resampling, and compute resampling probabilities.",blocks:[
["p","Instead of a grid or a bell curve, keep a cloud of guesses called particles. Each particle is one possible state (x, y, heading). Where particles crowd together, the robot probably is."],
["an","Send 1,000 scouts out with copies of the map. Each scout pretends to be the robot. When the real robot reports what it sees, scouts whose view matches get a high score. Then you recruit a new team by copying high scorers and dropping low scorers."],
["h","The loop"],
["list",["Move: move every particle with the robot's motion plus some random noise.","Weight: w = P(actual measurement | this particle's position), using a Gaussian on the sensor error.","Resample: draw N new particles with replacement, P(pick) ∝ weight."]],
["ex","Weights 0.6, 1.2, 2.4, 0.6, 1.2 sum to 6. Normalized: 0.1, 0.2, 0.4, 0.1, 0.2. With N = 5 draws, the 0.4 particle is expected to appear 2 times, and P(it's never picked) = 0.6⁵ ≈ 0.078."],
["h","The resampling wheel"],
["p","Put particles around a wheel, each taking up a slice as wide as its weight. Step around the wheel by random amounts up to 2 × the biggest weight, picking whatever slice you land in. Big slices get picked more often."],
["h","Why they're popular"],
["list",["Continuous and multimodal: can track several possible places at once.","Easy to program. That is Sebastian's 'key advantage'.","Weakness: needs exponentially many particles as dimensions grow."]],
["trap","Too few particles, or no noise in motion, means the cloud collapses onto a few duplicates and can lose track of the robot."]]},

{t:"BIKE",n:"Lesson 3b",title:"The bicycle model: how a car moves",mins:8,goal:"Move a robot pose with a steering angle and a distance.",blocks:[
["p","A robot's pose is (x, y, θ): where it is and which way it faces. Each step you give it two controls: a steering angle α and a distance d."],
["an","Picture a shopping cart with a steerable front wheel. Hold the wheel at a fixed angle and push: the cart traces a circle. A sharper angle makes a tighter circle; a longer cart (bigger wheelbase L) makes a wider one."],
["h","Straight (α ≈ 0)"],
["eq","x' = x + d·cos θ    y' = y + d·sin θ    θ' = θ"],
["h","Turning"],
["eq","R = L / tan α    β = d / R    cx = x − R·sin θ    cy = y + R·cos θ"],
["eq","θ' = θ + β    x' = cx + R·sin θ'    y' = cy − R·cos θ'"],
["ex","L = 1, α = π/4 (tan = 1), start (0, 0, 0), d = π/2. R = 1, β = π/2, center (0, 1). New pose (1, 1, π/2): a quarter circle to the left."],
["list",["Positive α turns left (counterclockwise). Negative α makes R and β negative, so the robot turns right.","Use the straight-line formulas when |β| is tiny to avoid dividing by ~0.","Bearing to a landmark = atan2(ly − y, lx − x) − θ."]],
["trap","Find the circle's center first, then rotate around it. Mixing up sin and cos in the center formula is the usual slip."]]},

{t:"SEARCH",n:"Lesson 4 · final exam",title:"Search: finding the cheapest route",mins:12,goal:"Run breadth-first search, A* and value iteration on small grids.",blocks:[
["p","Now the robot knows where it is and needs a route to the goal. The world is a grid: 0 = free, 1 = wall. Each move has a cost, usually 1."],
["an","Breadth-first search is like dropping a pebble in a pond: the ripple reaches every cell 1 step away, then 2 steps, and so on. A* is a ripple that's pulled toward the goal by a magnet (the heuristic)."],
["h","Vocabulary"],
["list",["g = cost so far from the start.","h = heuristic: an optimistic guess of the remaining cost.","f = g + h. A* always expands the open cell with the smallest f.","Open list = frontier waiting to be expanded. Closed = already handled."]],
["h","Admissible heuristics"],
["p","A heuristic is admissible if it never OVERestimates the true remaining cost. Then A* is guaranteed to find the cheapest path. h = 0 is always admissible (A* becomes plain search). On a 4-direction grid with cost 1, Manhattan distance |Δx| + |Δy| is admissible. With diagonal moves at cost 1 it isn't; use max(|Δx|, |Δy|)."],
["ex","Open cells A (g 4, h 3), B (g 2, h 6), C (g 5, h 1). f = 7, 8, 6. A* expands C next."],
["h","Dynamic programming (value iteration)"],
["p","Instead of one path, compute for EVERY cell the cost to reach the goal. Goal = 0. Repeat value(cell) = min over moves [step cost + value(neighbor)] until nothing changes. The best action in each cell (the policy) is the move toward the neighbor with the lowest value."],
["ex","Corridor of five cells with the goal on the right: values 4, 3, 2, 1, 0. Every cell's policy is 'move right'."],
["h","When moves are unreliable"],
["p","With stochastic motion an action might slip sideways. The value becomes an average: step cost + Σ P(outcome) × value(outcome), with walls costing collision_cost. The policy then keeps a safe distance from walls."],
["eq","V = cost + p·V(intended) + (1−p)/2·V(left slip) + (1−p)/2·V(right slip)"],
["trap","A non-admissible heuristic doesn't stop A* finding a path; it MAY make the path suboptimal. Count MOVES, not cells, when computing values."]]},

{t:"PID",n:"Lesson 5 · final exam",title:"Smoothing and PID control",mins:12,goal:"Smooth a grid path and compute P, PD and PID steering by hand.",blocks:[
["p","The grid path has sharp 90° corners no car can drive. First smooth it, then steer along it with a controller."],
["h","Smoothing"],
["p","Each path point yᵢ is pulled two ways: back toward its original position xᵢ (stay faithful) and toward the midpoint of its neighbors (be smooth). Start and goal stay fixed. Repeat until the points stop moving."],
["eq","yᵢ += α(xᵢ − yᵢ) + β(yᵢ₊₁ + yᵢ₋₁ − 2yᵢ)"],
["an","Imagine the path as a chain of beads, each tied by a rubber band to its original spot and another rubber band to its neighbors. Let go and the chain relaxes into a smooth curve near the original."],
["list",["Only α (data): the original path.","Only β (smooth) with fixed ends: a straight line.","Both: a smooth path that hugs the original.","Smoothing knows nothing about walls, so it can cut corners."]],
["h","Cross-track error"],
["p","CTE is how far the car is sideways from the path. The controller turns the CTE into a steering angle."],
["an","Lane keeping: P is how hard you turn the wheel when you notice you've drifted. D is easing off the wheel as you come back to the center so you don't swerve past it. I is noticing you're always slightly left because the steering is misaligned, and correcting for that."],
["eq","steer = −τp·CTE − τd·(CTE − CTE_prev)/Δt − τi·ΣCTE"],
["list",["P only: overshoots and oscillates.","PD: glides onto the line without overshooting.","PD with steering drift: settles at a constant offset.","PID: the I term removes that offset."]],
["ex","τp = 0.2, τd = 3, CTE 0.5, previous 0.6. P part −0.1, D part −3 × (−0.1) = +0.3. Steer = +0.2: it counter-steers because it's already closing in fast."],
["h","Twiddle"],
["p","Automatically tune [τp, τd, τi]. For each gain: try it bigger; if the error improves, keep it and grow the step (× 1.1). Otherwise try it smaller; if that improves, keep it and grow the step. Otherwise restore it and shrink the step (× 0.9). Stop when the steps are tiny."],
["trap","Each term has its own minus sign. The D term uses the CHANGE in CTE, so a shrinking error gives a positive D contribution."]]},

{t:"SLAM",n:"Lesson 6 · final exam",title:"Graph SLAM: map and locate at once",mins:12,goal:"Fill in Ω and ξ by hand and predict how the solution changes.",blocks:[
["p","Without a map you can't localize, and without knowing where you are you can't map. SLAM does both together. Graph SLAM is the version taught here, and it is just bookkeeping with additions."],
["an","Every motion and every landmark sighting is a rubber band between two things: 'x₁ should be about 5 to the right of x₀', 'the landmark is about 9 ahead of x₁'. Pin the first pose down, let all the bands pull at once, and the resting shape is your best path and map."],
["h","The bookkeeping"],
["p","Make a square matrix Ω (one row and column per pose and landmark) and a vector ξ, both starting at zero. For each constraint, add numbers into a few entries."],
["list",["Initial position x₀ = a: Ω[0][0] += 1, ξ[0] += a.","Constraint xⱼ − xᵢ = d (a motion or a measurement): Ω[i][i] += 1, Ω[j][j] += 1, Ω[i][j] −= 1, Ω[j][i] −= 1, ξ[i] −= d, ξ[j] += d.","More confident? Multiply that constraint's Ω and ξ entries by the same bigger weight (1/σ)."]],
["eq","μ = Ω⁻¹ · ξ"],
["ex","x₀ = −3, move +5, move +3, landmark seen at +10, +5, +2. Solving gives (−3, 2, 5) for the path and 7 for the landmark. Change the last sighting to +1 and the solution becomes (−3, 2.125, 5.5, 6.875): the conflict is shared out, but x₀ never moves because it's the only absolute anchor."],
["h","Reading the matrix"],
["list",["A zero in Ω means no direct constraint between those two variables.","Landmarks never see each other, so the landmark–landmark block is diagonal.","Constraints = 1 + (poses − 1) + measurements.","In 2-D with x and y interleaved, Ω is 2(N + L) × 2(N + L).","Full SLAM: Ω grows quadratically. Online SLAM drops old poses so it stays fixed-size."]],
["trap","Watch double negatives: a move of −4 from x₁ to x₂ adds +4 to ξ[x₁] and −4 to ξ[x₂]. Scale Ω and ξ together when weighting."]]},

{t:"EXAM",n:"Game plan",title:"How to use this app before Oct 23",mins:3,goal:"A simple plan to go from beginner to exam-ready.",blocks:[
["list",["Read one lesson, then press 'Practice this topic'. The ladder starts at level 1 and climbs to level 5.","Miss something? Read every option's explanation, not just the right one. Then use 'Drill my misses' at the end.","Use Cards for formulas and definitions on the go.","Two to three days before the window: take the timed mock midterm twice. Aim for 85% or more before Oct 23.","Midterm (Oct 23–25): Localization, Probability, Kalman, Particle, Bicycle. Search, PID and SLAM come on the final (Dec 11–13), so study those after the midterm unless you're ahead."]],
["p","Levels: 1 super easy (vocabulary), 2 easy (one idea), 3 medium (one calculation), 4 hard (multi-step or subtle), 5 super hard (exam-killer traps)."]]}
];

(function(){
const TOP = {LOC:"Localization",PROB:"Probability",KF:"Kalman filters",PF:"Particle filters",BIKE:"Bicycle model",SEARCH:"Search & planning",PID:"PID & smoothing",SLAM:"SLAM",EXAM:"Exam rules"};
const SHORT = {LOC:"Localization",PROB:"Probability",KF:"Kalman",PF:"Particle",BIKE:"Bicycle",SEARCH:"Search",PID:"PID",SLAM:"SLAM"};
const MID = ["LOC","PROB","KF","PF","BIKE"], FIN = ["SEARCH","PID","SLAM"];
const QT = MID.concat(FIN);
const LVL = ["","Super easy","Easy","Medium","Hard","Super hard"];
Q.forEach(function(q,i){ q.id = i; if(q.a===undefined) q.a = 0; });
const $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function ansSet(q){ return Array.isArray(q.a) ? q.a : [q.a]; }
function lvlHtml(d){ let h='<span class="lvl" title="Level '+d+'">'; for(let k=1;k<=5;k++) h+='<i class="'+(k<=d?'on':'')+'"></i>'; return h+'</span>'; }
const LET = "ABCDEFG";

// storage (per-device convenience only)
function load(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let stats = load("rmd-stats",{});      // id -> {n, c, last}
let mocks = load("rmd-mocks",[]);      // [{score, total, at, kind}]
let cardState = load("rmd-cards",{});  // idx -> known(bool)
let learned = load("rmd-learn",{});    // lesson idx -> true
function record(q, ok){ const s = stats[q.id] || {n:0,c:0,last:0}; s.n++; if(ok) s.c++; s.last = ok?1:0; stats[q.id]=s; save("rmd-stats",stats); }

// ---------- tabs ----------
function showTab(v){
  document.querySelectorAll(".tab").forEach(function(t){ t.setAttribute("aria-selected", t.dataset.v===v ? "true":"false"); });
  document.querySelectorAll("section.view").forEach(function(s){ s.hidden = s.id !== "v-"+v; });
  if(v==="stats") renderStats();
  if(v==="mock" && !mock.running && !mock.review) renderMockIntro();
  window.scrollTo(0,0);
}
document.querySelector(".tabs").addEventListener("click",function(e){ const b = e.target.closest(".tab"); if(b) showTab(b.dataset.v); });

// ---------- LEARN ----------
const L = {open:-1};
function renderLearn(){
  const v = $("v-learn");
  if(L.open < 0){
    let h = '<p class="note">New to a topic? Read its lesson (about 10 minutes), then practice it from level 1 upward. Lessons are in the order the course teaches them.</p><div class="lessons">';
    let lastSec = "";
    LESSONS.forEach(function(l,i){
      const sec = l.t==="EXAM" ? "How to study" : (FIN.indexOf(l.t)>=0 ? "Final exam topics (not on the midterm)" : "Midterm topics");
      if(sec!==lastSec){ h += '<p class="sec">'+sec+'</p>'; lastSec = sec; }
      h += '<button class="lcard" data-li="'+i+'"><span class="ln">'+esc(l.n)+' · '+l.mins+' min</span>'+(learned[i]?'<span class="done">✓ read</span>':'')+'<span class="lt">'+esc(l.title)+'</span><span class="lg">'+esc(l.goal)+'</span></button>';
    });
    v.innerHTML = h + '</div>';
    return;
  }
  const l = LESSONS[L.open];
  let h = '<div class="row"><button class="btn ghost" id="lBack">← All lessons</button></div><article class="card lesson"><span class="ln eyebrow">'+esc(l.n)+' · '+l.mins+' min read</span><h2>'+esc(l.title)+'</h2><p class="muted">Goal: '+esc(l.goal)+'</p>';
  l.blocks.forEach(function(b){
    const k=b[0], x=b[1];
    if(k==="p") h += '<p>'+esc(x)+'</p>';
    else if(k==="h") h += '<h3>'+esc(x)+'</h3>';
    else if(k==="eq") h += '<div class="eqn">'+esc(x)+'</div>';
    else if(k==="list") h += '<ul>'+x.map(function(li){ return '<li>'+esc(li)+'</li>'; }).join("")+'</ul>';
    else h += '<div class="blk '+k+'"><b>'+({an:"Picture it",ex:"Worked example",trap:"Common trap"}[k]||"")+'</b>'+esc(x)+'</div>';
  });
  h += '</article><div class="row">';
  if(l.t!=="EXAM") h += '<button class="btn" id="lPractice" data-t="'+l.t+'">Practice '+esc(SHORT[l.t])+': easy → hard</button>';
  if(L.open < LESSONS.length-1) h += '<button class="btn ghost" id="lNext">Next: '+esc(LESSONS[L.open+1].title)+'</button>';
  v.innerHTML = h + '</div>';
}
$("v-learn").addEventListener("click",function(e){
  const c = e.target.closest(".lcard"); if(c){ L.open = +c.dataset.li; learned[L.open]=true; save("rmd-learn",learned); renderLearn(); window.scrollTo(0,0); return; }
  if(e.target.closest("#lBack")){ L.open=-1; renderLearn(); window.scrollTo(0,0); return; }
  if(e.target.closest("#lNext")){ L.open++; learned[L.open]=true; save("rmd-learn",learned); renderLearn(); window.scrollTo(0,0); return; }
  const p = e.target.closest("#lPractice"); if(p){ P.level="ALL"; P.ladder=true; startPractice(p.dataset.t); showTab("practice"); }
});

// ---------- question renderer (shared) ----------
function renderQuestion(host, q, order, opts){
  const multi = Array.isArray(q.a);
  const chosen = opts.chosen || [];
  const reveal = !!opts.reveal;
  const correct = ansSet(q);
  let h = '<div class="card"><div class="meta"><span>'+esc(TOP[q.t])+(FIN.indexOf(q.t)>=0?' · final':'')+'</span><span>'+lvlHtml(q.d)+' '+esc(LVL[q.d])+'</span><span>'+esc(opts.counter||"")+'</span></div>';
  h += '<p class="qtext">'+esc(q.q)+'</p>';
  if(q.g) h += '<pre class="grid">'+esc(q.g)+'</pre>';
  if(multi) h += '<p class="multi-note">Select all that apply</p>';
  h += '<div class="opts">';
  order.forEach(function(oi,pos){
    let cls = "opt";
    const isSel = chosen.indexOf(oi) >= 0;
    if(reveal){ if(correct.indexOf(oi)>=0) cls += " right"; else if(isSel) cls += " wrong"; }
    else if(isSel) cls += " sel";
    h += '<button class="'+cls+'" data-oi="'+oi+'"'+(reveal?' disabled':'')+' aria-pressed="'+isSel+'"><span class="L">'+LET[pos]+'</span><span class="T">'+esc(q.o[oi][0])+'</span></button>';
  });
  h += '</div>';
  if(reveal){
    const ok = sameSet(chosen, correct);
    if(opts.showVerdict !== false) h += '<p class="verdict '+(ok?'ok':'bad')+'">'+(ok?'Correct':'Not quite')+'</p>';
    h += '<div class="why"><h3>Every option, explained</h3>';
    order.forEach(function(oi,pos){
      const c = correct.indexOf(oi)>=0;
      h += '<div class="wl '+(c?'c':'x')+'"><span class="tag">'+LET[pos]+(c?' ✓':' ✗')+'</span><div><b>'+esc(q.o[oi][0])+'</b>'+esc(q.o[oi][1])+'</div></div>';
    });
    h += '</div><div class="key"><b>Remember</b>'+esc(q.k)+'</div>';
    h += '<p class="note">Source: '+esc(q.s)+'</p>';
  }
  h += (opts.footer||'') + '</div>';
  host.innerHTML = h;
}
function sameSet(a,b){ if(a.length!==b.length) return false; return a.every(function(x){ return b.indexOf(x)>=0; }); }

// ---------- PRACTICE ----------
const P = {open:false, filter:"MID", level:"ALL", ladder:true, deck:[], i:0, order:[], chosen:[], reveal:false, right:0, done:0};
function topicPool(f){
  if(f==="ALL") return Q.slice();
  if(f==="MID") return Q.filter(function(q){ return MID.indexOf(q.t)>=0; });
  if(f==="FIN") return Q.filter(function(q){ return FIN.indexOf(q.t)>=0; });
  if(f==="MISSED") return Q.filter(function(q){ const s = stats[q.id]; return s && s.last===0; });
  if(f==="NEW") return Q.filter(function(q){ return !stats[q.id]; });
  return Q.filter(function(q){ return q.t===f; });
}
function practicePool(f, lv){ const p = topicPool(f); return lv==="ALL" ? p : p.filter(function(q){ return q.d===+lv; }); }
function buildDeck(){
  const pool = shuffle(practicePool(P.filter, P.level));
  if(!P.ladder) return pool;
  return pool.sort(function(a,b){ return a.d-b.d; });   // shuffled within each level, easy first
}
function startPractice(f){ if(f) P.filter = f; P.deck = buildDeck(); P.i = 0; P.right = 0; P.done = 0; nextSetup(); renderPractice(); }
function nextSetup(){ const q = P.deck[P.i]; P.chosen=[]; P.reveal=false; P.order = q ? shuffle(q.o.map(function(_,k){return k;})) : []; }
function chip(attr,val,label,on,n,extra){ return '<button class="chip'+(extra||'')+'" '+attr+'="'+val+'" aria-pressed="'+on+'">'+label+(n!==undefined?'<span class="n">'+n+'</span>':'')+'</button>'; }
const FNAME = {MID:"All midterm",FIN:"All final",ALL:"Everything",MISSED:"Missed",NEW:"Unseen"};
function controlsHtml(){
  const cur = (FNAME[P.filter]||SHORT[P.filter])+' · '+(P.level==="ALL"?"all levels":"level "+P.level)+' · '+(P.ladder?"easy → hard":"shuffled");
  let bar = '<div class="ctlbar"><span class="cur">'+esc(cur)+'</span><button class="btn ghost" id="pCtl" aria-expanded="'+P.open+'">'+(P.open?'Done':'Change')+'</button></div>';
  if(!P.open) return bar;
  return bar + controlsFull();
}
function controlsFull(){
  const ts = [["MID","All midterm"],["LOC","Localization"],["PROB","Probability"],["KF","Kalman"],["PF","Particle"],["BIKE","Bicycle"],["FIN","All final"],["SEARCH","Search"],["PID","PID"],["SLAM","SLAM"],["ALL","Everything"],["MISSED","Missed"],["NEW","Unseen"]];
  let h = '<div class="ctl"><span class="lab">Topic</span><div class="chips">'+ts.map(function(f){ return chip("data-f",f[0],f[1],P.filter===f[0],topicPool(f[0]).length, (f[0]==="FIN"||FIN.indexOf(f[0])>=0)?' fin':''); }).join("")+'</div>';
  h += '<span class="lab">Level</span><div class="chips">'+chip("data-l","ALL","All levels",P.level==="ALL")+[1,2,3,4,5].map(function(k){ return chip("data-l",k,k+' · '+LVL[k],P.level===String(k),practicePool(P.filter,k).length); }).join("")+'</div>';
  h += '<span class="lab">Order</span><div class="chips">'+chip("data-o","ladder","Ladder: easy → hard",P.ladder)+chip("data-o","shuffle","Shuffle",!P.ladder)+'</div></div>';
  return h;
}
function renderPractice(){
  const v = $("v-practice");
  const q = P.deck[P.i];
  let top = controlsHtml();
  if(FIN.indexOf(P.filter)>=0 || P.filter==="FIN") top += '<p class="note">Search, PID and SLAM are on the final exam (Dec 11–13), not the midterm.</p>';
  if(!q){
    let msg = P.filter==="MISSED" ? "No missed questions right now. Answer some questions first, or everything you missed has since been answered correctly." :
      (P.done ? "You've gone through this whole set: "+P.right+" of "+P.done+" correct." : "No questions match this topic and level.");
    v.innerHTML = top + '<div class="card"><p class="qtext">'+esc(msg)+'</p><div class="row"><button class="btn" id="pRestart">Go again</button><button class="btn ghost" id="pMissed">Drill my misses</button></div></div>';
    return;
  }
  v.innerHTML = top + '<div id="pq"></div>';
  const multi = Array.isArray(q.a);
  let footer = '<div class="row">';
  if(!P.reveal && multi) footer += '<button class="btn" id="pCheck"'+(P.chosen.length?'':' disabled')+'>Check answer</button>';
  if(P.reveal){
    const nq = P.deck[P.i+1];
    footer += '<button class="btn" id="pNext">'+(nq && P.ladder && nq.d>q.d ? 'Next: level '+nq.d+' ('+LVL[nq.d].toLowerCase()+')' : 'Next question')+'</button>';
  }
  footer += '<span class="spacer"></span><span class="mono muted">'+P.right+'/'+P.done+' this round</span></div>';
  renderQuestion($("pq"), q, P.order, {chosen:P.chosen, reveal:P.reveal, counter:(P.i+1)+" of "+P.deck.length, footer:footer});
}
$("v-practice").addEventListener("click",function(e){
  const c = e.target.closest(".chip");
  if(c){
    if(c.dataset.f) P.filter = c.dataset.f;
    if(c.dataset.l) P.level = c.dataset.l;
    if(c.dataset.o) P.ladder = c.dataset.o==="ladder";
    startPractice(); return;
  }
  if(e.target.closest("#pCtl")){ P.open=!P.open; renderPractice(); return; }
  if(e.target.closest("#pRestart")){ startPractice(); return; }
  if(e.target.closest("#pMissed")){ P.level="ALL"; startPractice("MISSED"); return; }
  const q = P.deck[P.i]; if(!q) return;
  const o = e.target.closest(".opt");
  if(o && !P.reveal){
    const oi = +o.dataset.oi;
    if(Array.isArray(q.a)){ const k = P.chosen.indexOf(oi); if(k>=0) P.chosen.splice(k,1); else P.chosen.push(oi); renderPractice(); }
    else { P.chosen=[oi]; grade(); }
    return;
  }
  if(e.target.closest("#pCheck")){ grade(); return; }
  if(e.target.closest("#pNext")){ P.i++; nextSetup(); renderPractice(); const t=$("pq")||$("v-practice"); if(t.getBoundingClientRect().top<0) window.scrollTo(0, window.scrollY+t.getBoundingClientRect().top-70); }
});
function grade(){ const q = P.deck[P.i]; const ok = sameSet(P.chosen, ansSet(q)); P.reveal=true; P.done++; if(ok) P.right++; record(q,ok); renderPractice(); }

// ---------- MOCK EXAM ----------
const KINDS = {
  mid:{name:"Mock midterm", n:20, mins:60, quota:{LOC:5, PROB:2, KF:7, PF:4, BIKE:2}, blurb:"20 questions in 60 minutes across Localization, Probability, Kalman filters, Particle filters and the Bicycle model, matching the real midterm's scope and format."},
  fin:{name:"Mock final", n:30, mins:90, quota:{SEARCH:8, PID:8, SLAM:8, LOC:2, KF:2, PF:1, BIKE:1}, blurb:"30 questions in 90 minutes, about 80% Search, PID and SLAM like the real final (Dec 11–13). Save this one for after the midterm."}
};
const mock = {kind:"mid", running:false, qs:[], orders:[], ans:[], i:0, end:0, tick:null, review:false};
function pickExam(kind){
  const quota = KINDS[kind].quota; let out = [];
  Object.keys(quota).forEach(function(t){ out = out.concat(shuffle(Q.filter(function(q){return q.t===t && q.d>=2;})).slice(0,quota[t])); });
  return shuffle(out);
}
function renderMockIntro(){
  let h = '';
  ["mid","fin"].forEach(function(k){
    const K = KINDS[k], mine = mocks.filter(function(m){ return (m.kind||"mid")===k; });
    const best = mine.length ? Math.max.apply(null, mine.map(function(m){return Math.round(100*m.score/m.total);})) : null;
    h += '<div class="card"><h2 style="font-size:26px">'+K.name+'</h2><p>'+K.blurb+' No feedback until you submit; then every question is reviewed with full explanations.</p>';
    h += '<div class="row"><button class="btn'+(k==="fin"?' ghost':'')+'" data-mk="'+k+'">Start '+K.name.toLowerCase()+'</button>'+(best!==null?'<span class="mono muted">Best '+best+'% · '+mine.length+' taken</span>':'')+'</div></div>';
  });
  h += '<p class="note">The real exam bank isn\'t public, so these are practice questions built from the lectures, problem sets and exam-prep sessions (levels 2–5 only). Questions reshuffle on every attempt.</p>';
  $("v-mock").innerHTML = h;
}
function startMock(kind){
  mock.kind = kind || mock.kind; const K = KINDS[mock.kind];
  mock.qs = pickExam(mock.kind); mock.orders = mock.qs.map(function(q){ return shuffle(q.o.map(function(_,k){return k;})); });
  mock.ans = mock.qs.map(function(){ return []; }); mock.i = 0; mock.review=false; mock.running = true;
  mock.total = K.mins*60*1000; mock.end = Date.now() + mock.total;
  clearInterval(mock.tick); mock.tick = setInterval(tickMock, 1000);
  renderMock(); window.scrollTo(0,0);
}
function timeLeft(){ return Math.max(0, mock.end - Date.now()); }
function fmtT(ms){ const s = Math.ceil(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function tickMock(){ const t = $("mTimer"); const left = timeLeft(); if(t){ t.textContent = fmtT(left); t.classList.toggle("low", left < 5*60*1000); } if(left<=0 && !mock.review) submitMock(); }
function renderMock(){
  const v = $("v-mock");
  if(mock.review){ renderReview(); return; }
  const q = mock.qs[mock.i];
  let h = '<div class="row"><span class="timer" id="mTimer">'+fmtT(timeLeft())+'</span><span class="muted">'+KINDS[mock.kind].name+'</span><span class="spacer"></span><button class="btn ghost" id="mSubmitAsk">Submit exam</button></div>';
  h += '<div class="dots">'+mock.qs.map(function(_,k){ return '<button class="dot'+(mock.ans[k].length?' ans':'')+(k===mock.i?' cur':'')+'" data-j="'+k+'" aria-label="Question '+(k+1)+'">'+(k+1)+'</button>'; }).join("")+'</div>';
  h += '<div id="mConfirm"></div><div id="mq"></div>';
  v.innerHTML = h;
  const footer = '<div class="row"><button class="btn ghost" id="mPrev"'+(mock.i===0?' disabled':'')+'>Back</button><span class="spacer"></span><button class="btn" id="mNext">'+(mock.i===mock.qs.length-1?'Finish':'Next')+'</button></div>';
  renderQuestion($("mq"), q, mock.orders[mock.i], {chosen:mock.ans[mock.i], reveal:false, counter:"Question "+(mock.i+1)+" of "+mock.qs.length, footer:footer});
}
function askSubmit(){
  const blank = mock.ans.filter(function(a){return !a.length;}).length;
  $("mConfirm").innerHTML = '<div class="confirm"><p>'+(blank? blank+' question'+(blank>1?'s are':' is')+' unanswered. ':'')+'Submit and see your score?</p><div class="row"><button class="btn warn" id="mSubmit">Submit now</button><button class="btn ghost" id="mCancel">Keep working</button></div></div>';
}
function submitMock(){
  clearInterval(mock.tick); mock.review = true; mock.running = false;
  let score = 0;
  mock.qs.forEach(function(q,k){ const ok = sameSet(mock.ans[k], ansSet(q)); if(ok) score++; record(q, ok); });
  mock.score = score; mock.used = mock.total - timeLeft();
  mocks.push({score:score,total:mock.qs.length,at:Date.now(),kind:mock.kind}); save("rmd-mocks",mocks);
  mock.i = 0; renderMock(); window.scrollTo(0,0);
}
function renderReview(){
  const v = $("v-mock");
  const pct = Math.round(100*mock.score/mock.qs.length);
  let h = '<div class="card"><div class="meta"><span>'+KINDS[mock.kind].name+' result</span><span>'+fmtT(mock.used)+' used</span></div><div class="row"><span class="big">'+pct+'%</span><span class="muted">'+mock.score+' of '+mock.qs.length+' correct</span></div>';
  const byT = {};
  mock.qs.forEach(function(q,k){ byT[q.t] = byT[q.t] || {n:0,c:0}; byT[q.t].n++; if(sameSet(mock.ans[k],ansSet(q))) byT[q.t].c++; });
  h += '<p class="note">'+Object.keys(byT).map(function(t){ return TOP[t]+' '+byT[t].c+'/'+byT[t].n; }).join(' · ')+'</p>';
  h += '<div class="row"><button class="btn" id="mAgain">Take another</button><button class="btn ghost" id="mDrill">Drill my misses</button><button class="btn ghost" id="mHome">Back to mocks</button></div></div>';
  h += '<div class="dots">'+mock.qs.map(function(q,k){ const ok = sameSet(mock.ans[k],ansSet(q)); return '<button class="dot '+(ok?'ok':'bad')+(k===mock.i?' cur':'')+'" data-j="'+k+'">'+(k+1)+'</button>'; }).join("")+'</div><div id="mq"></div>';
  v.innerHTML = h;
  const q = mock.qs[mock.i];
  const footer = '<div class="row"><button class="btn ghost" id="mPrev"'+(mock.i===0?' disabled':'')+'>Previous</button><span class="spacer"></span><button class="btn" id="mNext"'+(mock.i===mock.qs.length-1?' disabled':'')+'>Next</button></div>';
  renderQuestion($("mq"), q, mock.orders[mock.i], {chosen:mock.ans[mock.i], reveal:true, counter:"Question "+(mock.i+1)+(mock.ans[mock.i].length?'':' · left blank'), footer:footer});
}
$("v-mock").addEventListener("click",function(e){
  const mk = e.target.closest("[data-mk]"); if(mk){ startMock(mk.dataset.mk); return; }
  if(e.target.closest("#mAgain")){ startMock(); return; }
  if(e.target.closest("#mHome")){ mock.review=false; renderMockIntro(); return; }
  if(e.target.closest("#mDrill")){ P.level="ALL"; startPractice("MISSED"); showTab("practice"); return; }
  if(e.target.closest("#mSubmitAsk")){ askSubmit(); return; }
  if(e.target.closest("#mSubmit")){ submitMock(); return; }
  if(e.target.closest("#mCancel")){ $("mConfirm").innerHTML=""; return; }
  const d = e.target.closest(".dot"); if(d){ mock.i = +d.dataset.j; renderMock(); return; }
  if(e.target.closest("#mPrev")){ mock.i = Math.max(0,mock.i-1); renderMock(); return; }
  if(e.target.closest("#mNext")){ if(!mock.review && mock.i===mock.qs.length-1){ renderMock(); askSubmit(); return; } mock.i = Math.min(mock.qs.length-1, mock.i+1); renderMock(); return; }
  const o = e.target.closest(".opt");
  if(o && !mock.review){
    const q = mock.qs[mock.i]; const oi = +o.dataset.oi; const a = mock.ans[mock.i];
    if(Array.isArray(q.a)){ const k=a.indexOf(oi); if(k>=0) a.splice(k,1); else a.push(oi); } else { mock.ans[mock.i]=[oi]; }
    renderMock();
  }
});

// ---------- FLASHCARDS ----------
const F = {filter:"ALL", deck:[], i:0, flipped:false, again:0, known:0};
function cardPool(f){ return CARDS.map(function(c,i){ return {c:c,i:i}; }).filter(function(x){ return f==="ALL" || (f==="TODO" ? !cardState[x.i] : (f==="MID" ? MID.indexOf(x.c[0])>=0 : (f==="FIN" ? FIN.indexOf(x.c[0])>=0 : x.c[0]===f))); }); }
function startCards(f){ F.filter=f; F.deck = shuffle(cardPool(f)); F.i=0; F.flipped=false; F.again=0; F.known=0; renderCards(); }
function renderCards(){
  const fs = [["ALL","All"],["MID","Midterm"],["LOC","Localization"],["PROB","Probability"],["KF","Kalman"],["PF","Particle"],["BIKE","Bicycle"],["FIN","Final"],["SEARCH","Search"],["PID","PID"],["SLAM","SLAM"],["EXAM","Exam rules"],["TODO","Not yet known"]];
  let h = '<div class="chips">'+fs.map(function(f){ return chip("data-cf",f[0],f[1],F.filter===f[0],cardPool(f[0]).length,(f[0]==="FIN"||FIN.indexOf(f[0])>=0)?' fin':''); }).join("")+'</div>';
  const x = F.deck[F.i];
  if(!x){
    h += '<div class="card"><p class="qtext">'+(F.known+F.again ? 'Deck finished. '+F.known+' marked known, '+F.again+' sent back for another pass.' : 'No cards here. Everything in this set is marked known.')+'</p><div class="row"><button class="btn" id="cRestart">Shuffle and go again</button><button class="btn ghost" id="cTodo">Only cards I don\'t know</button></div></div>';
  } else {
    h += '<button class="flash'+(F.flipped?' flipped':'')+'" id="cFlip" aria-label="Flip card"><span class="face">'+esc(TOP[x.c[0]])+' · '+(F.flipped?'answer':'tap to reveal')+'</span><span class="front">'+esc(x.c[1])+'</span>'+(F.flipped?'<span class="back">'+esc(x.c[2])+'</span>':'')+'</button>';
    h += '<div class="row"><button class="btn ghost" id="cAgain"'+(F.flipped?'':' disabled')+'>Again</button><button class="btn" id="cKnow"'+(F.flipped?'':' disabled')+'>Got it</button><span class="spacer"></span><span class="mono muted">'+(F.i+1)+' / '+F.deck.length+'</span></div>';
  }
  $("v-cards").innerHTML = h;
}
$("v-cards").addEventListener("click",function(e){
  const c = e.target.closest(".chip"); if(c){ startCards(c.dataset.cf); return; }
  if(e.target.closest("#cRestart")){ startCards(F.filter); return; }
  if(e.target.closest("#cTodo")){ startCards("TODO"); return; }
  if(e.target.closest("#cFlip")){ F.flipped=!F.flipped; renderCards(); return; }
  const x = F.deck[F.i]; if(!x) return;
  if(e.target.closest("#cKnow")){ cardState[x.i]=true; save("rmd-cards",cardState); F.known++; F.i++; F.flipped=false; renderCards(); return; }
  if(e.target.closest("#cAgain")){ delete cardState[x.i]; save("rmd-cards",cardState); F.again++; const pos = Math.min(F.deck.length, F.i+4); F.deck.splice(pos,0,x); F.i++; F.flipped=false; renderCards(); }
});

// ---------- FORMULA SHEET ----------
function renderSheet(){
  let h = '<div class="sheet">';
  QT.concat(["EXAM"]).forEach(function(t){
    if(t==="SEARCH") h += '<p class="sec">Final exam topics</p>';
    h += '<div><h2>'+TOP[t]+'</h2><dl>'+CARDS.filter(function(c){return c[0]===t;}).map(function(c){ return '<dt>'+esc(c[1])+'</dt><dd>'+esc(c[2])+'</dd>'; }).join("")+'</dl></div>';
  });
  $("v-sheet").innerHTML = h + '</div>';
}

// ---------- PROGRESS ----------
function bar(label, qs){
  let n=0,c=0,seen=0; qs.forEach(function(q){ const s=stats[q.id]; if(s){ n+=s.n; c+=s.c; seen++; } });
  const pct = n ? Math.round(100*c/n) : 0;
  return '<div class="bar"><span>'+label+'</span><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><span class="mono">'+(n?pct+'%':'–')+'</span></div><p class="note" style="margin-top:-6px">'+seen+' of '+qs.length+' seen'+(n?', '+c+'/'+n+' correct':'')+'</p>';
}
function renderStats(){
  let h = '<div class="card"><h2 style="font-size:24px">Accuracy by topic</h2><div class="bars"><p class="sec">Midterm</p>';
  MID.forEach(function(t){ h += bar(SHORT[t], Q.filter(function(q){return q.t===t;})); });
  h += '<p class="sec">Final only</p>';
  FIN.forEach(function(t){ h += bar(SHORT[t], Q.filter(function(q){return q.t===t;})); });
  h += '</div></div><div class="card"><h2 style="font-size:24px">Accuracy by level</h2><div class="bars">';
  [1,2,3,4,5].forEach(function(k){ h += bar(k+' · '+LVL[k], Q.filter(function(q){return q.d===k;})); });
  h += '</div></div>';
  const missed = Q.filter(function(q){ const s=stats[q.id]; return s && s.last===0; }).length;
  h += '<div class="card"><div class="row"><span class="big">'+missed+'</span><span class="muted">questions you last got wrong</span></div><div class="row"><button class="btn" id="sDrill"'+(missed?'':' disabled')+'>Drill them now</button></div></div>';
  if(mocks.length){
    h += '<div class="card"><h2 style="font-size:24px">Mock exams</h2><div class="bars">'+mocks.slice(-8).map(function(m){ const p=Math.round(100*m.score/m.total); const d=new Date(m.at); return '<div class="bar"><span class="mono">'+((m.kind||"mid")==="fin"?"F ":"M ")+(d.getMonth()+1)+'/'+d.getDate()+'</span><div class="track"><div class="fill" style="width:'+p+'%"></div></div><span class="mono">'+p+'%</span></div>'; }).join("")+'</div><p class="note">M = mock midterm, F = mock final.</p></div>';
  }
  h += '<div class="card"><p class="note">Progress is saved in this browser on this device only.</p><div id="sReset"><button class="btn ghost" id="sResetAsk">Reset all progress</button></div></div>';
  $("v-stats").innerHTML = h;
}
$("v-stats").addEventListener("click",function(e){
  if(e.target.closest("#sDrill")){ P.level="ALL"; startPractice("MISSED"); showTab("practice"); return; }
  if(e.target.closest("#sResetAsk")){ $("sReset").innerHTML = '<div class="confirm"><p>Erase all answers, mock scores, flashcard marks and lesson ticks on this device?</p><div class="row"><button class="btn warn" id="sResetYes">Erase progress</button><button class="btn ghost" id="sResetNo">Cancel</button></div></div>'; return; }
  if(e.target.closest("#sResetYes")){ stats={}; mocks=[]; cardState={}; learned={}; save("rmd-stats",stats); save("rmd-mocks",mocks); save("rmd-cards",cardState); save("rmd-learn",learned); renderStats(); renderLearn(); return; }
  if(e.target.closest("#sResetNo")){ renderStats(); }
});

renderLearn();
startPractice("MID");
startCards("ALL");
renderSheet();
renderMockIntro();
})();
</script>
